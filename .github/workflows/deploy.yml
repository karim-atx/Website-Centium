name: Deploy hub to GitHub Pages

# Publishes the Atraxia hub (hub/) — and only the hub. It's hand-written
# static HTML with no build step, so this workflow just uploads the directory
# as-is: no Node, no npm ci, no `npm run build`.
#
# Centium used to be built here too and then reshuffled into a /centium
# subfolder so the hub could take over the site root. It now builds and
# deploys on its own (Cloudflare Pages, centium.atraxia.org), so that whole
# step is gone along with the /404.html copy that gave the Centium SPA its
# deep-link fallback — GitHub Pages now serves hub/404.html (formerly
# public/atraxia-404.html) as this site's 404 instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hub

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
