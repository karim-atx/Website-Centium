<!doctype html>
<!--
  atraxia.org/atraxia-404.html — Atraxia's custom "page not found" page.

  Named distinctly from dist/404.html on purpose: that file is already
  claimed by the Centium SPA (see .github/workflows/deploy.yml — it's a
  copy of the built Centium app's index.html, which is what makes deep
  links like atraxia.org/centium/pricing work via GitHub Pages' 404
  fallback + React Router's client-side routing). Overwriting it here
  would break every deep link into the Centium app, so this hub-branded
  404 lives at its own path instead and is wired up as the true catch-all
  for the hub's own paths in deploy/cloudflare-worker.js.

  Design pass v10 (Claude Design handoff, item #37 — see
  scratchpad/design-handoff-atraxia-landing-v10/design_handoff_atraxia_landing/
  README.md): full replacement of the plain placeholder page above with the
  handoff's on-brand design — the site's cream/teal gradient and teal-pale
  glow, a seeded 46-star field (deterministic PRNG, not Math.random(), so
  the layout never reshuffles on reload) with two drifting streaks, the
  mark + wordmark linking home, a large ghosted "404", "Page not found",
  and buttons to home and the legal centre. Respects prefers-reduced-motion.
  Light-mode only, matching hub.html itself (no dark-mode variant exists
  there either) — the previous version's dark-mode palette is dropped here
  since it wasn't part of this page's actual design language.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- CONTENT SECURITY POLICY. This origin holds no application any more,
         but it did once, and browsers that used the app through it still
         carry its localStorage until the cleanup block below runs. Until
         they next visit, this is the only thing standing between that data
         and anything that manages to execute here.

         WHAT IT ACTUALLY BUYS, given the page it is on. `connect-src 'none'`
         is the load-bearing line: these pages make no fetch, XHR, WebSocket,
         EventSource or sendBeacon call of any kind — verified across all
         three — so nothing legitimate is lost, and reading localStorage
         stops being useful to anything that cannot then send it anywhere.
         `script-src 'self'` blocks the likeliest real-world accident on a
         marketing site, which is someone pasting in a third-party analytics
         or chat tag. `form-action 'none'` and `base-uri 'none'` close the
         two exfiltration routes that do not need script at all.

         'unsafe-inline' IS IN script-src, AND IT IS THE WEAK POINT. Every
         script on these pages is inline, and the alternatives were both
         worse here:

           Nonces need a value generated per response. GitHub Pages serves
           static files; there is nowhere to generate one.

           Hashes would work, and would be the right answer if these scripts
           were stable. They are not — index.html alone carries a 65 KB hero
           script and a 45 KB nav script that are regenerated by design
           handovers, and .github/workflows/deploy.yml exists precisely to
           upload this directory with no Node and no build step, so nothing
           would recompute them. A stale hash fails silently: the browser
           simply does not run the script. The script it would stop running
           is the legacy-data cleanup below. Trading a certain, silent
           re-opening of the exact bug this file exists to close against a
           speculative XSS on a page with no user input, no query-parameter
           rendering and no innerHTML sink is not a trade worth making.

         So the honest summary is that this policy constrains what can be
         LOADED and where anything can be SENT, and does not constrain inline
         execution. If the hub ever gains a build step, hashes should replace
         'unsafe-inline' that same day.

         `frame-ancestors` IS ABSENT BECAUSE A META TAG CANNOT CARRY IT —
         browsers ignore it there, and a directive that does nothing reads
         like protection that is not present. It belongs in a response
         header, which deploy/cloudflare-worker.js is the place to add when
         that file is next deployed by hand. -->

      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; manifest-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'"
    />

      :root {
        --cream: 255 255 255;
        --bg-grad-a: 217 234 240;
        --charcoal: 6 20 25;

        --navy: 2 59 74;

        --teal-dark: 33 100 116;

      .streak--a { left: 8%; top: 6%; width: 150px; background: linear-gradient(90deg, rgb(var(--teal) / 0) 0%, rgb(var(--teal) / 0.55) 55%, rgb(255 255 255 / 0.9) 100%); animation: atx404Streak 13s linear 2s infinite; }
      .streak--b { left: 52%; top: 2%; width: 104px; background: linear-gradient(90deg, rgb(var(--teal) / 0) 0%, rgb(var(--teal) / 0.4) 55%, rgb(255 255 255 / 0.75) 100%); animation: atx404Streak 17s linear 7s infinite; }

      header { position: relative; z-index: 1; }

      }
      .code {

        animation: atx404Rise 0.6s cubic-bezier(.22,1,.36,1) 0.12s both;
      }
      h1 {
        font-size: clamp(1.7rem, 5vw, 2.4rem); line-height: 1.12; letter-spacing: -0.02em;
        margin: 0 0 0.9rem;
        animation: atx404Rise 0.6s cubic-bezier(.22,1,.36,1) 0.2s both;
      }
      p {
        margin: 0 0 2.1rem; font-size: 1.02rem; line-height: 1.7;
        color: rgb(var(--charcoal-soft)); text-wrap: pretty;
        animation: atx404Rise 0.6s cubic-bezier(.22,1,.36,1) 0.28s both;
      }
      .actions {
        display: flex; align-items: center; justify-content: center;
        gap: 0.75rem; flex-wrap: wrap;
        animation: atx404Rise 0.6s cubic-bezier(.22,1,.36,1) 0.36s both;
      }
      .btn { text-decoration: none; font-weight: 600; font-size: 0.92rem; padding: 0.8rem 1.5rem; border-radius: 999px; }
      .btn--primary { background: rgb(var(--navy)); color: rgb(var(--cream)); }
      .btn--ghost { background: transparent; border: 1px solid rgb(var(--border) / 0.25); color: rgb(var(--navy)); }

      footer { position: relative; z-index: 1; border-top: 1px solid rgb(var(--border) / 0.1); padding: 1.5rem; }
      footer .wrap { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 1rem; flex-wrap: wrap; }
      footer small { color: rgb(var(--charcoal-faint)); }

      @keyframes atx404Star { 0%, 100% { opacity: 0.18; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes atx404Rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes atx404Streak {
        0%, 88% { opacity: 0; transform: translate3d(0,0,0) rotate(26deg); }
        90% { opacity: 0.9; }
        99% { opacity: 0; transform: translate3d(460px,224px,0) rotate(26deg); }
        100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .star, .streak, .eyebrow, .code, h1, p, .actions { animation: none !important; opacity: 1 !important; transform: none !important; }
        .streak { display: none !important; }
      }

    <!-- LEGACY CENTIUM DATA CLEANUP. Runs on atraxia.org only, and exists
         because this origin once ran the Centium app itself.

         WHAT HAPPENED. Between 2026-08-27 and 2026-09-07 the Cloudflare
         Worker reverse-proxied atraxia.org/centium/* to the Centium build on
         GitHub Pages, so the app executed under THIS origin and wrote its
         `centium-state:*` localStorage keys here — including health data
         (bloodMarkers, comorbidities, clientHealthNotes, clientAccessGrants).
         On 2026-09-07 the proxy became a 301 to centium.atraxia.org, so
         nothing has written here since. localStorage never expires, though,
         so the data stayed behind on every browser that used the app in that
         window. This clears it.

         MATCHES `centium-` RATHER THAN `centium-state:`, which is wider than
         the incident strictly needs and is deliberate. Verified against the
         app as it stood on 2026-09-07: it had exactly one storage prefix,
         because every write went through a single `localStorage.setItem(
         `${STORAGE_KEY}:${key}`)` call with STORAGE_KEY = "centium-state".
         So `centium-state:` was complete for what could be here.

         The wider match is about what comes next rather than what happened.
         The app has since added other prefixes — `centium-onboarding:` among
         them — and those ARE included on purpose: no key beginning
         `centium-` has any business existing on this origin at all. The app
         does not run here, and the Worker's own invariant says it never will
         again, so anything with that name is either legacy or a mistake, and
         both should go. Naming today's prefixes individually would mean
         remembering to come back here every time the app adds another one,
         which is exactly the kind of thing nobody remembers.

         It cannot touch the live ones. `centium-onboarding:` is current state
         on centium.atraxia.org, and that is a different origin: the
         same-origin policy alone makes it unreachable from here, and the
         hostname guard below refuses to run anywhere but atraxia.org in any
         case.

         NOT A SERVICE WORKER PROBLEM, checked rather than assumed: the app's
         service worker was added 2026-09-14, a week AFTER the proxy ended, so
         none was ever registered under this origin. The unregister call below
         is defensive — it costs one promise and removes the doubt — not the
         mechanism this is here to defeat.

         ON EVERY HTML PAGE THIS ORIGIN SERVES, which is the whole point of
         the copy in legal.html. That page is one of the two URLs in
         sitemap.xml and robots.txt allows it, so a search result can land
         someone there and nowhere else — and for as long as it carried no
         cleanup, that visit left the data exactly where it was. Confirmed by
         testing, not assumed. Inline in each page rather than one shared
         file: the Worker serves this origin from an explicit path allowlist
         it does not deploy automatically, so a `<script src>` would 404 in
         production until someone updated the Worker by hand, and the cleanup
         would die silently — which is the failure this exists to prevent.

         RUNS EVERY LOAD, not once behind a flag. It is a handful of
         localStorage reads, and a one-shot marker would be one more key on an
         origin the whole point is to leave clean. -->
    <script>
      (function () {
        try {
          var h = location.hostname;
          if (h !== "atraxia.org" && h !== "www.atraxia.org") return;

          try {
            var keys = [];
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k && k.indexOf("centium-") === 0) keys.push(k);
            }
            for (var j = 0; j < keys.length; j++) localStorage.removeItem(keys[j]);
            if (keys.length) {
              console.info("[atraxia] Cleared " + keys.length + " legacy Centium key(s) from this origin.");
            }
          } catch (e) {
            /* Storage blocked or unavailable — nothing to clear, nothing to do. */
          }

          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              for (var r = 0; r < regs.length; r++) regs[r].unregister();
            }).catch(function () {});
          }
        } catch (e) {
          /* Never let cleanup break the page it is embedded in. */
        }
      })();
    </script>
  </head>

    <div class="starfield" aria-hidden="true" id="atx404-stars">

    <script>
      // Deterministic PRNG (not Math.random()) — the field is generated once
      // at load, and a fixed seed means the layout never reshuffles on a
      // reload, unlike a truly random scatter would.
      (function () {
        var seed = 20260905;
        function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
        var host = document.getElementById('atx404-stars');
        var frag = document.createDocumentFragment();
        for (var i = 0; i < 46; i++) {
          var size = (rnd() * 2.1 + 1.1).toFixed(2);
          var el = document.createElement('span');
          el.className = 'star';
          el.style.left = (rnd() * 100).toFixed(2) + '%';
          el.style.top = (rnd() * 78).toFixed(2) + '%';
          el.style.width = size + 'px';
          el.style.height = size + 'px';
          el.style.animation = 'atx404Star ' + (3.2 + rnd() * 4.4).toFixed(2) + 's ease-in-out ' + (rnd() * 5).toFixed(2) + 's infinite';
          frag.appendChild(el);
        }
        host.insertBefore(frag, host.firstChild);
      })();
    </script>
