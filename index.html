<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Built with relative asset paths (see vite.config.ts) so this same
      // build works both raw on GitHub Pages and proxied at
      // atraxia.org/centium/ — this picks the right one to resolve
      // everything else in the document against, before anything else
      // here gets fetched. The build (see .github/workflows/deploy.yml)
      // moves this app's build output to a /centium subfolder so the hub
      // page can take over the true root, so the raw GitHub Pages path is
      // one segment deeper than the proxied one.
      (function () {
        var segs = location.pathname.split('/').filter(Boolean);
        var base = '/';
        if (segs[0] === 'centium') {
          base = '/centium/';
        } else if (segs[0] === 'Website-Centium' && segs[1] === 'centium') {
          base = '/Website-Centium/centium/';
        }
        var el = document.createElement('base');
        el.href = base;
        document.head.appendChild(el);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#AEA1DC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D0B1A" media="(prefers-color-scheme: dark)" />
    <title>Centium — Your health, all in one place</title>
    <meta
      name="description"
      content="Centium brings nutrition tracking, workout logging, health tracking, AI-powered guidance and community into one place."
    />
    <meta property="og:title" content="Centium — Your health, all in one place" />
    <meta
      property="og:description"
      content="Centium brings nutrition tracking, workout logging, health tracking, AI-powered guidance and community into one place."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Centium — Your health, all in one place" />
    <meta
      name="twitter:description"
      content="Centium brings nutrition tracking, workout logging, health tracking, AI-powered guidance and community into one place."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
